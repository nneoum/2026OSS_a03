<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음악 플레이리스트 - 음악 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="my.css" />
</head>

<body>
  <header class="site-header navbar">
    <div class="container">
      <h1 class="site-title navbar-brand"><a href="index.html">🎵 음악 플레이리스트</a></h1>
      <nav class="main-nav navbar-nav flex-row">
        <a href="index.html" class="nav-link">목록</a>
        <a href="add.html" class="nav-link">음악 추가</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">음악 수정</h2>

    <div class="alert alert-info" role="alert">* 표시된 항목은 필수 입력 항목입니다.</div>

    <form id="editMusicForm" class="music-form" onsubmit="return checkEditForm();">
      <div class="row g-3">
        <div class="form-group col-md-6">
          <label for="title">제목 *</label>
          <input type="text" class="form-control" id="title" name="title" required />
        </div>

        <div class="form-group col-md-6">
          <label for="artist">아티스트 *</label>
          <input type="text" class="form-control" id="artist" name="artist" required />
        </div>

        <div class="form-group col-md-6">
          <label for="album">앨범 *</label>
          <input type="text" class="form-control" id="album" name="album" required />
        </div>

        <div class="form-group col-md-6">
          <label for="releaseDate">발매일 *</label>
          <input type="date" class="form-control" id="releaseDate" name="releaseDate" required />
        </div>

        <div class="form-group col-md-6">
          <label for="duration">재생시간 *</label>
          <input type="text" class="form-control" id="duration" name="duration" required />
        </div>

        <div class="form-group col-md-6">
          <label for="playCount">재생횟수 *</label>
          <input type="number" class="form-control" id="playCount" name="playCount" required />
        </div>

        <div class="form-group col-12">
          <label for="genre">장르 *</label>
          <select class="form-select" id="genre" name="genre" required>
            <option value="">선택하세요</option>
            <option value="K-Pop">K-Pop</option>
            <option value="Pop">Pop</option>
            <option value="Hip-Hop">Hip-Hop</option>
            <option value="R&amp;B">R&amp;B</option>
            <option value="Rock">Rock</option>
            <option value="Jazz">Jazz</option>
            <option value="Classical">Classical</option>
            <option value="EDM">EDM</option>
            <option value="Indie">Indie</option>
            <option value="OST">OST</option>
            <option value="Ballad">Ballad</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">수정</button>
        <a href="view.html" id="cancelLink" class="btn btn-secondary">취소</a>
      </div>
    </form>

    <a href="index.html" class="back-link">← 목록으로</a>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 음악 플레이리스트 - CRUD</p>
  </footer>

  <script src="data.js"></script>
  <script>
    var currentId = Number(new URLSearchParams(location.search).get("id")) || 1;
    var music = musicList.find(function (item) { return item.id === currentId; }) || musicList[0];

    document.getElementById("title").value = music.title;
    document.getElementById("artist").value = music.artist;
    document.getElementById("album").value = music.album;
    document.getElementById("releaseDate").value = music.releaseDate;
    document.getElementById("duration").value = music.duration;
    document.getElementById("playCount").value = music.playCount;
    document.getElementById("genre").value = music.genre;
    document.getElementById("cancelLink").href = "view.html?id=" + music.id;

    function checkEditForm() {
      var title = document.getElementById("title").value.trim();
      var artist = document.getElementById("artist").value.trim();
      var album = document.getElementById("album").value.trim();
      var releaseDate = document.getElementById("releaseDate").value;
      var duration = document.getElementById("duration").value.trim();
      var playCount = document.getElementById("playCount").value;
      var genre = document.getElementById("genre").value;

      if (title === "" || artist === "" || album === "" || duration === "" || playCount === "") {
        alert("모든 항목을 빠짐없이 입력해주세요.");
        return false;
      }

      if (title.length < 2 || title.length > 50) {
        alert("제목은 2자 이상 50자 이하로 입력해주세요.");
        return false;
      }

      var count = Number(playCount);
      if (playCount === "" || isNaN(count) || count < 0 || count > 100000000) {
        alert("재생횟수는 0 ~ 100,000,000 사이의 숫자로 입력해주세요.");
        return false;
      }

      if (releaseDate === "") {
        alert("발매일을 입력해주세요.");
        return false;
      }

      if (genre === "") {
        alert("장르를 선택해주세요.");
        return false;
      }

      var ok = confirm("게시물을 수정할까요?");
      if (ok) {
        alert("수정이 완료되었습니다.");
        location.href = "view.html?id=" + currentId;
      }
      return false;
    }
  </script>
</body>
</html>
