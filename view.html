<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음악 플레이리스트 - 상세보기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="my.css" />
</head>
<body>
  <header class="site-header navbar">
    <div class="container">
      <h1 class="site-title navbar-brand"><a href="index.html">🎵 음악 플레이리스트</a></h1>
      <nav class="main-nav navbar-nav flex-row">
        <a href="index.html" class="nav-link">목록</a>
        <a href="add.html" class="nav-link">음악 추가</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">음악 상세 정보</h2>

    <div class="card music-detail">
      <dl class="detail-list">
        <dt>제목</dt><dd id="detailTitle"></dd>
        <dt>아티스트</dt><dd id="detailArtist"></dd>
        <dt>앨범</dt><dd id="detailAlbum"></dd>
        <dt>발매일</dt><dd id="detailReleaseDate"></dd>
        <dt>재생시간</dt><dd id="detailDuration"></dd>
        <dt>재생횟수</dt><dd id="detailPlayCount"></dd>
        <dt>장르</dt><dd id="detailGenre"></dd>
      </dl>
    </div>

    <div class="form-actions">
      <a href="edit.html" id="editLink" class="btn btn-primary">수정</a>
      <button onclick="deleteMusic();" class="btn btn-danger">삭제</button>
    </div>

    <a href="index.html" class="back-link">← 목록으로</a>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 음악 플레이리스트 - Frontend CRUD 실습</p>
  </footer>

  <script src="data.js"></script>
  <script>
    var currentId = Number(new URLSearchParams(location.search).get("id")) || 1;
    var music = musicList.find(function (item) { return item.id === currentId; }) || musicList[0];

    document.getElementById("detailTitle").textContent = music.title;
    document.getElementById("detailArtist").textContent = music.artist;
    document.getElementById("detailAlbum").textContent = music.album;
    document.getElementById("detailReleaseDate").textContent = music.releaseDate;
    document.getElementById("detailDuration").textContent = music.duration;
    document.getElementById("detailPlayCount").textContent = music.playCount.toLocaleString() + "회";
    document.getElementById("detailGenre").textContent = music.genre;
    document.getElementById("editLink").href = "edit.html?id=" + music.id;

    function deleteMusic() {
      var ok = confirm("이 음악을 삭제하시겠습니까?");
      if (ok) {
        alert("삭제되었습니다.");
        location.href = "index.html";
      }
    }
  </script>
</body>
</html>
